  <style>
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background-color: rgb(28, 72, 57);
      /* base — never a white pre-paint */
    }

    /* Background gradient on a dedicated fixed div BEHIND the canvas (z 0 <
         canvas z 1). It mirrors the procedural loaderGradient (see main.js
         loaderGradient stops / center / radii) and shows through the
         transparent canvas during the loader (renderer clearAlpha=0). Once the
         WebGL bgPass renders its matching gradient, the opaque canvas covers
         this div — seamless. */
    #bg-gradient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-color: rgb(28, 72, 57);
      background-image: radial-gradient(ellipse 126.7vw 143.4vh at 50% 130%,
          rgb(212, 246, 235) 15.855%,
          rgb(179, 222, 209) 26.169%,
          rgb(145, 199, 183) 36.483%,
          rgb(112, 175, 156) 46.797%,
          rgb(78, 151, 130) 57.111%,
          rgb(53, 111, 94) 78.555%,
          rgb(28, 72, 57) 100%);
    }

    /* Dummy pre-canvas placeholder: a "99" in the bottom-left that paints
         on the very first layout and shows through the transparent canvas
         alongside #bg-gradient while WebGL boots. Purely decorative. */
    #pre-canvas-99 {
      position: fixed;
      left: 2.0833vw;
      /* 40 / 1920 */
      bottom: 3.7037vh;
      /* 40 / 1080 (fallback) */
      bottom: 3.7037svh;
      z-index: 0;
      pointer-events: none;
      user-select: none;
      font:
        700 16.667vh/1 'Supply Sans',
        monospace;
      /* 180 / 1080 (fallback) */
      font-size: 12svh;
      /* fit 9 letters */
      color: #ffffff;
    }

    @media (max-width: 767px) {
      #pre-canvas-99 {
        left: 4.1667vw;
        /* 80 / 1920 */
        font-size: 10.185vh;
        /* 110 / 1080 (fallback) */
        font-size: 6.5svh;
        /* fit 9 letters */
      }
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
    }

    #webgl {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: auto;
      touch-action: none;
    }

    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
  </style>
